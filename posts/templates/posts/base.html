{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog de Ignacio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <header class="encabezado">
        <a class="logo" href="{% url 'posts:inicio' %}">Blog de Ignacio</a>
        <nav class="menu">
            <a href="{% url 'posts:inicio' %}">Inicio</a>
            <a href="{% url 'posts:lista_posts' %}">Posts</a>
            <a href="{% url 'posts:crear_post' %}">Nuevo post</a>
            <a href="{% url 'posts:acerca' %}">Acerca de</a>
        </nav>
    </header>

    <main class="contenido">
        {% if messages %}
            {% for message in messages %}
            <p class="mensaje">{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <footer class="pie">
        <p>Blog de Ignacio &middot; Hecho con Django</p>
    </footer>
</body>
</html>
