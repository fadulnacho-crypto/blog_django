{% extends 'posts/base.html' %}

{% block title %}Cambiar contraseña | Blog de Ignacio{% endblock %}

{% block content %}
<div class="caja-angosta">
    <h1>Cambiar contraseña</h1>

    <div class="tarjeta">
        <form method="post" class="formulario">
            {% csrf_token %}
            {% include 'accounts/_campos.html' with form=form %}
            <div class="acciones">
                <button type="submit" class="boton">Cambiar contraseña</button>
                <a href="{% url 'perfil' %}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
