{# Muestra todos los campos de un formulario con su etiqueta, ayuda y errores #}
{{ form.non_field_errors }}
{% for campo in form %}
<div class="campo">
    <label class="etiqueta" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}<div class="ayuda">{{ campo.help_text|safe }}</div>{% endif %}
    {% if campo.errors %}<p class="error">{{ campo.errors|join:" " }}</p>{% endif %}
</div>
{% endfor %}
